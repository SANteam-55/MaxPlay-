<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MaxPlay - Stream Movies, Shows & Anime</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="MaxPlay - Stream Movies, Shows & Anime" />
    <meta name="description" content="Watch unlimited movies, TV shows, and anime in HD with fast multi-audio streaming, adaptive bitrates, offline downloads, and cloud sync on MaxPlay." />
    <meta name="keywords" content="MaxPlay, streaming, movies, TV series, anime, Hindi dub, offline downloads, 4K streaming" />
    <meta name="author" content="SAN TEAM" />
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaxPlay" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maxplay.app" />
    <meta property="og:title" content="MaxPlay - Stream Movies, Shows & Anime" />
    <meta property="og:description" content="Stream the best movies, web series, and anime with multi-language audio and seamless video playback." />
    <meta property="og:image" content="/app-logo.png" />

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="MaxPlay - Stream Movies, Shows & Anime" />
    <meta property="twitter:description" content="Stream the best movies, web series, and anime with multi-language audio and seamless video playback." />
    <meta property="twitter:image" content="/app-logo.png" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var SW_VERSION = 'maxplay-pwa-v7';
        try {
          if (
            'serviceWorker' in navigator &&
            navigator.serviceWorker.controller &&
            localStorage.getItem('MAXPLAY_SW_ACTIVE_VER') !== SW_VERSION
          ) {
            localStorage.setItem('MAXPLAY_SW_ACTIVE_VER', SW_VERSION);
            try { window.stop(); } catch (e) {}
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
              .then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              })
              .finally(function () {
                window.location.reload();
              });
            return;
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              var staleKeys = keys.filter(function (k) { return k !== SW_VERSION; });
              if (staleKeys.length > 0) {
                Promise.all(staleKeys.map(function (k) { return caches.delete(k); }));
              }
            });
          }
          localStorage.setItem('MAXPLAY_SW_ACTIVE_VER', SW_VERSION);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0A0A0A] text-white antialiased selection:bg-[#8B5CF6] selection:text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then(function (reg) {
              reg.update();
              console.log('[MaxPlay PWA] Service worker registered successfully:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[MaxPlay PWA] Service worker registration warning:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
